- name: Pull k6 image
  community.docker.docker_image:
    name: grafana/k6
    source: pull

- name: Create load test directory
  ansible.builtin.file:
    path: "{{ test_dir }}"
    state: directory
    mode: "0755"

- name: Run load tests
  ansible.builtin.include_tasks:
    file: run_load_test.yml
  loop: "{{ frontend_endpoints | product(k6_load_levels) | list }}"
  loop_control:
    loop_var: load_test
    label: >-
      {{ load_test.0.name }}
      port={{ load_test.0.port }}
      vus={{ load_test.1 }}
